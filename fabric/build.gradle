plugins {
    id 'multiloader-loader'
    id 'com.github.johnrengelman.shadow'
    id "me.shedaniel.unified-publishing"
    id 'fabric-loom'
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${parchment_minecraft}:${parchment_version}@zip")
    }

    implementation group: 'com.google.code.findbugs', name: 'jsr305', version: '3.0.1'
    compileOnly(annotationProcessor("org.parchmentmc.data:parchment-${parchment_minecraft}:${parchment_version}@zip"))

    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    modImplementation "io.github.llamalad7:mixinextras-fabric:0.5.0"
    include "io.github.llamalad7:mixinextras-fabric:0.5.0"

    // NEI APIs
    modCompileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    modCompileOnly "mezz.jei:jei-${minecraft_version}-fabric-api:${jei_version}"
    modCompileOnly "me.shedaniel:RoughlyEnoughItems-fabric:${rei_version}"
    modCompileOnly "dev.emi:emi-fabric:${emi_version}+${minecraft_version}:api"

    // WAILA APIs
    modCompileOnly "maven.modrinth:nvQzSEkH:${jade_fabric_version}"
    modCompileOnly "maven.modrinth:6AQIaxuO:${wthit_fabric_version}"
    modCompileOnly "maven.modrinth:ftdbN0KK:${badpackets_fabric_version}"

    // NEI runtime
    def nei = (findProperty("fabric_nei") ?: "JEI").toString().toUpperCase(Locale.ROOT)
    def neiRuntime = [
            JEI: {
                add("modRuntimeOnly", "mezz.jei:jei-${minecraft_version}-fabric:${jei_version}")
            },
            REI: {
                add("modRuntimeOnly", "me.shedaniel:RoughlyEnoughItems-fabric:${rei_version}")
            },
            EMI: {
                add("modRuntimeOnly", "dev.emi:emi-fabric:${emi_version}+${minecraft_version}")
            }
    ]
    neiRuntime[nei]?.call()

    // WAILA runtime
    def waila = (findProperty("fabric_waila") ?: "JADE").toString().toUpperCase(Locale.ROOT)
    def wailaRuntime = [
            JADE : {
                add("modRuntimeOnly", "maven.modrinth:nvQzSEkH:${jade_fabric_version}")
            },
            WTHIT: {
                add("modRuntimeOnly", "maven.modrinth:6AQIaxuO:${wthit_fabric_version}")
                add("modRuntimeOnly", "maven.modrinth:ftdbN0KK:${badpackets_fabric_version}")
            }
    ]
    wailaRuntime[waila]?.call()

    // TechReborn
    modCompileOnly modApi("teamreborn:energy:${teamreborn_energy_version}") {
        exclude(group: "net.fabricmc.fabric-api")
    }
    modCompileOnly "curse.maven:reborncore-${reborncore_curse_project_id}:${reborncore_fabric_curse_file_id}"
    modCompileOnly "curse.maven:techreborn-${techreborn_curse_project_id}:${techreborn_fabric_curse_file_id}"

    // Mod Menu
    modImplementation "com.terraformersmc:modmenu:${modmenu_version}"

    // Night Config
    implementation 'com.electronwill.night-config:core:3.6.6'
    implementation 'com.electronwill.night-config:toml:3.6.6'

    shadow 'com.electronwill.night-config:core:3.6.6'
    shadow 'com.electronwill.night-config:toml:3.6.6'
}


shadowJar {
    dependsOn jar
    configurations = [project.configurations.shadow]
    destinationDirectory.set(file("${project.layout.buildDirectory.get()}/devlibs"))
    archiveClassifier.set("dev")
    relocate "com.electronwill.nightconfig", "${group}.shadow.nightconfig"
}

remapJar.dependsOn(shadowJar)

loom {
/*    if (project(":common").file("src/main/resources/${mod_id}.accesswidener").exists()) {
        accessWidenerPath.set(project(":common").file("src/main/resources/${mod_id}.accesswidener"))
    }*/
    mixin {
        defaultRefmapName.set("${mod_id}.refmap.json")
    }
    runs {
        client {
            client()
            setConfigName("Fabric Client")
            ideConfigGenerated(true)
            runDir("run")
        }
        server {
            server()
            setConfigName("Fabric Server")
            ideConfigGenerated(true)
            runDir("run")
        }
    }
}

setupDatagenTask('dataCommon', 'common', project(":common").file("src/generated/resources"))
setupDatagenTask('dataFabric', 'fabric', project.file("src/generated/resources"))
setupDatagenTask('dataForge', 'forge', project(":forge").file("src/generated/resources"))
setupDatagenTask('dataNeoForge', 'neoforge', project(":neoforge").file("src/generated/resources"))

def setupDatagenTask(String name, String platform, File outputDir) {
    loom.runs.create(name) {
        client()
        setConfigName("Datagen: ${platform}")
        ideConfigGenerated(true)
        runDir("build/datagen")

        vmArg "-Dfabric-api.datagen"
        vmArg "-Dfabric-api.datagen.output-dir=${outputDir}"
        vmArg "-Dfabric-api.datagen.modid=${mod_id}"
        vmArg "-Dplatform=${platform}"
        vmArg "-Ddatagen=true"
        vmArg "-Dfabric.debug.disableModIds=techreborn,reborncore,team_reborn_energy"
    }
}


sourceSets {
    main {
        resources {
            srcDirs 'src/generated/resources'
            srcDirs project(':common').file('src/generated/resources')
        }
    }
}


configureUnifiedPublishing(project, [
        loaderName: "Fabric",
        gameLoader: "fabric",
        releaseType: rootProject.fabric_release_type,
        publicationTask: "remapJar",
        relations: {
            depends {
                modrinth = "fabric-api"
                curseforge = "fabric-api"
            }
        }
])

