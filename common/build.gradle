plugins {
    id 'multiloader-common'
    id 'net.neoforged.moddev.legacyforge'
}

legacyForge {
    mcpVersion = minecraft_version
    if (file("src/main/resources/META-INF/accesstransformer.cfg").exists()) {
        accessTransformers = ["src/main/resources/META-INF/accesstransformer.cfg"]
    }
    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
}

dependencies {
    compileOnly group: 'org.spongepowered', name: 'mixin', version: '0.8.7'
    implementation group: 'com.google.code.findbugs', name: 'jsr305', version: '3.0.1'
    compileOnly 'com.electronwill.night-config:core:3.6.6'
    compileOnly 'com.electronwill.night-config:toml:3.6.6'


    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "maven.modrinth:nvQzSEkH:${jade_forge_version}"
    compileOnly "maven.modrinth:6AQIaxuO:${wthit_forge_version}"
    compileOnly "maven.modrinth:ftdbN0KK:${badpackets_forge_version}"


    compileOnly(annotationProcessor("org.parchmentmc.data:parchment-${parchment_minecraft}:${parchment_version}@zip"))

}

configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

artifacts {
    commonJava sourceSets.main.java.sourceDirectories.singleFile
    commonResources sourceSets.main.resources.sourceDirectories.singleFile
}
