plugins {
    id 'fabric-loom' version '1.8-SNAPSHOT' apply(false)
    id 'net.neoforged.moddev' version '2.0.77' apply(false)
    id 'net.neoforged.moddev.legacyforge' version '2.0.77' apply(false)
    id "me.shedaniel.unified-publishing" version "0.1.+" apply false
    id 'com.github.johnrengelman.shadow' version '8.1.1' apply(false)

}

allprojects {
    repositories {
        maven {
            url = "https://modmaven.dev"
        }
        maven {
            url 'https://maven.blamejared.com/'
            content {
                includeGroup 'noobanidus.mods.lootr'
            }
        }
        maven {
            url "https://maven.shedaniel.me"
        }
        maven {
            url "https://api.modrinth.com/maven"
        }
        maven {
            url "https://maven.fabricmc.net/"
        }
        maven {
            url = "https://maven.terraformersmc.com/"
        }
        maven {
            url "https://www.cursemaven.com"
            content {
                includeGroup "curse.maven"
            }
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = "UTF-8"
    }

    tasks.withType(Javadoc).configureEach {
        options.encoding = "UTF-8"
        options.addStringOption('charset', 'UTF-8')
        options.addStringOption('docencoding', 'UTF-8')
    }
}

static def getModNameForPublishing(String name) {
    return name.replaceAll(/\s+/, '')
}

def changelogForVersion(String version) {
    def file = file("${rootDir}/CHANGELOG.md")
    if (!file.exists()) return ""

    def text = file.text

    def pattern = ~/(?ms)^##\s*\[?${version}\]?[^\n]*\n(.*?)(?=^##\s|\z)/
    def matcher = text =~ pattern

    if (matcher.find()) {
        def entry = matcher.group(1).trim()
        return entry ?: ""
    }

    pattern = "(?ms)^##\\s*\\[?${version}\\]?\\s*(.*)\$"
    matcher = text =~ pattern
    return matcher.find() ? matcher.group(1).trim() : ""
}

ext.configureUnifiedPublishing = { Project p, Map cfg ->
    p.unifiedPublishing {
        project {
            displayName = "[${cfg.loaderName}]${getModNameForPublishing(p.mod_name)}-${p.minecraft_version}-${p.version}"
            releaseType = cfg.releaseType
            changelog = changelogForVersion(p.version)
            gameVersions = [p.minecraft_version]
            gameLoaders = [cfg.gameLoader]
            mainPublication p.tasks.named(cfg.publicationTask).get()

            if (cfg.relations instanceof Closure) {
                relations(cfg.relations as Closure)
            } else if (cfg.relationsDepends instanceof Map && !cfg.relationsDepends.isEmpty()) {
                relations {
                    depends {
                        cfg.relationsDepends.each { platform, dependencyId ->
                            setProperty(platform.toString(), dependencyId)
                        }
                    }
                }
            }

            def mrToken = p.findProperty("MODRINTH_TOKEN") ?: System.getenv("MODRINTH_TOKEN")
            if (mrToken != null) {
                modrinth {
                    token = mrToken
                    id = p.modrinth_project_id
                    version = p.version
                }
            }

            def cfToken = p.findProperty("CURSEFORGE_TOKEN") ?: System.getenv("CURSEFORGE_TOKEN")
            if (cfToken != null) {
                curseforge {
                    token = cfToken
                    id = p.rootProject.curseforge_project_id
                }
            }
        }
    }
}

