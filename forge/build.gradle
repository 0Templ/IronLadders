plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev.legacyforge'
    id "me.shedaniel.unified-publishing"
}

mixin {
    add(sourceSets.main, "${mod_id}.refmap.json")

    config("${mod_id}.mixins.json")
    config("${mod_id}.forge.mixins.json")
}

legacyForge {
    version = "${minecraft_version}-${forge_version}"


    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
    runs {
        client {
            client()
        }
        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }
        server {
            server()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

sourceSets {
    main {
        resources {
            srcDir 'src/generated/resources'
            srcDir project(':common').file('src/generated/resources')
            srcDir project(':common').file('src/main/resources')
        }
    }
}

dependencies {

    compileOnly project(":common")

    annotationProcessor("org.spongepowered:mixin:0.8.5-SNAPSHOT:processor")

    // JEI
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-forge-api:${jei_version}"

    // EMI
    compileOnly "dev.emi:emi-forge:${emi_version}+${minecraft_version}:api"

    //REI
    compileOnly ("me.shedaniel:RoughlyEnoughItems-forge:${rei_version}")

//    modImplementation ("curse.maven:cloth-config-${cloth_config_curse_project_id}:${cloth_config_forge_curse_file_id}")


    switch (forge_nei) {
        case "JEI":
            modImplementation ("mezz.jei:jei-${minecraft_version}-forge:${jei_version}")
            break
        case "REI":
            modImplementation ("me.shedaniel:RoughlyEnoughItems-forge:${rei_version}")
            break
        case "EMI":
            modImplementation ("dev.emi:emi-forge:${emi_version}+${minecraft_version}")
            break
    }

    // The One Probe
    compileOnly "maven.modrinth:Eyw0UxEx:${top_version}"

    // WTHIT
    compileOnly "maven.modrinth:6AQIaxuO:${wthit_forge_version}"
    compileOnly "maven.modrinth:ftdbN0KK:${badpackets_forge_version}"

    // Jade
    compileOnly ("maven.modrinth:jade:${jade_forge_version}")

    switch (forge_waila) {
        case "JADE":
            modImplementation ("maven.modrinth:jade:${jade_forge_version}")
            break
        case "TOP":
            modImplementation ("maven.modrinth:Eyw0UxEx:${top_version}")
            break
        case "WTHIT":
            modImplementation ("maven.modrinth:ftdbN0KK:${badpackets_forge_version}")
            modImplementation ("maven.modrinth:6AQIaxuO:${wthit_forge_version}")
            break
    }

    // Architectury
    modImplementation "dev.architectury:architectury-forge:9.2.14"

    // Cloth-config
    modImplementation("me.shedaniel.cloth:cloth-config-forge:11.1.136")

    // Mekanism
    modCompileOnly /*modRuntimeOnly*/ "mekanism:Mekanism:${mekanism_version}"

}


sourceSets.main.resources.srcDir 'src/generated/resources'

processResources {
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

jar {
    finalizedBy('reobfJar')
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
    manifest.attributes([
            "MixinConfigs": "${mod_id}.mixins.json,${mod_id}.forge.mixins.json"
    ])
}

unifiedPublishing {
    project {
        displayName = "[Forge]${getModNameForPublishing(project.mod_name)}-${project.minecraft_version}-${project.version}"
        releaseType = rootProject.forge_release_type
        changelog = changelogForVersion(project.version)
        gameVersions = [project.minecraft_version]
        gameLoaders = ["forge", "neoforge"]
        def publicationJar = tasks.named("reobfJar").get()
        mainPublication publicationJar
        var mrToken = project.findProperty("MODRINTH_TOKEN") ?: System.getenv("MODRINTH_TOKEN")
        if (mrToken != null) {
            modrinth {
                token = mrToken
                id = project.modrinth_project_id
                version = project.version
            }
        }
        var cfToken = project.findProperty("CURSEFORGE_TOKEN") ?: System.getenv("CURSEFORGE_TOKEN")
        if (cfToken != null) {
            curseforge {
                token = cfToken
                id = rootProject.curseforge_project_id
            }
        }
    }
}

